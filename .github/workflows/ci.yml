---
name: ci
'on':
  push:
    paths:
    - ".github/workflows/ci.yml"
    - lib/**
    - "*.gemspec"
    - spec/**
    - Rakefile
    - Gemfile
    - Gemfile.devtools
    - ".rubocop.yml"
  pull_request:
    branches:
    - master
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
        - '4.0'
        - '3.4'
        - '3.3'
        include:
        - ruby: '4.0'
          coverage: 'true'
          fail_on_warnings: 'true'
          dry_types_from_master: 'true'
          sequel_from_master: 'true'
    env:
      COVERAGE: "${{matrix.coverage}}"
      COVERAGE_TOKEN: "${{secrets.CODACY_PROJECT_TOKEN}}"
      APT_DEPS: libpq-dev libmysqlclient-dev libsqlite3-dev
      FAIL_ON_WARNINGS: "${{matrix.fail_on_warnings}}"
      DRY_TYPES_FROM_MASTER: "${{matrix.dry_types_from_master}}"
      SEQUEL_FROM_MASTER: "${{matrix.sequel_from_master}}"
    steps:
    - uses: actions/checkout@v1
    - name: Install package dependencies
      run: "[ -e $APT_DEPS ] || sudo apt-get install -y --no-install-recommends $APT_DEPS"
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "${{matrix.ruby}}"
    - name: Install latest bundler
      run: |
        gem install bundler --no-document
        bundle config set without 'tools benchmarks docs'
    - name: Bundle install
      run: bundle install --jobs 4 --retry 3
    - name: Run all tests
      run: bundle exec rake
    - name: Run codacy-coverage-reporter
      uses: codacy/codacy-coverage-reporter-action@master
      if: env.COVERAGE == 'true' && env.COVERAGE_TOKEN != ''
      with:
        project-token: "${{secrets.CODACY_PROJECT_TOKEN}}"
        coverage-reports: coverage/coverage.xml
    services:
      mysql:
        image: mysql:8.4
        ports:
        - 3307:3306
        env:
          MYSQL_USER: rom-sql
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: rom-sql
      postgres:
        image: postgres:16
        ports:
        - 5433:5432
        env:
          POSTGRES_USER: rom-sql
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rom-sql
